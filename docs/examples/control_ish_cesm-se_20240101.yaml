# General Description:  
# Any key that is specific for a plot type will begin with ts for timeseries, ty for taylor
# Opt: Specifying the variable or variable group is optional
# For now all plots except time series average over the analysis window. 
# Setting axis values - If set_axis = True in data_proc section of each plot_grp the yaxis for the plot will be set based on the values specified in the obs section for each variable. If set_axis is set to False, then defaults will be used. 'vmin_plot' and 'vmax_plot' are needed for 'timeseries', 'spatial_overlay', and 'boxplot'. 'vdiff_plot' is needed for 'spatial_bias' plots and'ty_scale' is needed for 'taylor' plots. 'nlevels' or the number of levels used in the contour plot can also optionally be provided for spatial_overlay plot. If set_axis = True and the proper limits are not provided in the obs section, a warning will print, and the plot will be created using the default limits.

#-------------------------------------------------------------------
# Universal comparison variables
analysis:
  start_time: '2024-01-01'          #UTC
  end_time: '2024-01-02'          #UTC
  output_dir: ./output/ish_cesmse
  output_dir_save: ./output/ish_cesmse
  output_dir_read: ./output/ish_cesmse

  save:
    paired:
      method: 'netcdf'
      prefix: '20240101'
      data: all
  read:
    paired:
      method: 'netcdf'
      filenames: {ish_cesm_se: ['ish_cesm_se']}
  download_maps: false #If off-line or on machine with download restrictions like hera set to False.
  debug: True
#-------------------------------------------------------------------
# Model definitions
model:
  cam-chem-se:
    files: /glade/work/lcthompson/mm_tutorial_data/Sample_CESM-SE_CONUS_ish_2024-01-01_03.nc
      # - /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-01-01-03600.nc
      # - /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-01-02-03600.nc
      # - /glade/campaign/acom/acom-da/conus_outputs/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002/H1/f.e22.FCnudged.ne0CONUSne30x8_ne0CONUSne30x8_mt12.ERA5_ref_dust_M1.1.002.cam.h1.2024-01-03-03600.nc
      
    mod_type: 'cesm_se'
    scrip_file: "/glade/campaign/acom/MUSICA/grids/ne0CONUSne30x8/ne0CONUS_ne30x8_np4_SCRIP.nc"
    
    radius_of_influence: 27794 #meters: horizontal resolution * 1.5

    extra_calc: # Add more complex calculations and their associated variables here.

    ####### Extra_calc naming example
    # variable_calculating
      # variable required for calculation: "variable name in model"
      
      windspeed:
        u_comp: "U"
        v_comp: "V"
      winddir: 
        u_comp: "U"
        v_comp: "V"
      wind_barb: 
        u_comp: "U" 
        v_comp: "V"
      rose_plot:
        model_wdir: "winddir"
        model_wspd: "windspeed"
        
    mapping: #model species name : obs species name
      ish:
        T: 't'
        windspeed: 'ws'
        winddir: 'wdir'
        
    projection:
    plot_kwargs: #Opt 
      color: 'purple'
      marker: 'x'
      linestyle: '-.'

#-------------------------------------------------------------------
# Observation definitions
obs:
  ish: # obs label
    filename: '/glade/u/home/lcthompson/mm/MELODIES-MONET/docs/examples/ungridded_support/unstructured_grid_read_uxarray/readthedocs/output/ish_cesmse/ISH_20240101_20240102.nc'

    obs_type: pt_sfc
    variables: # optional
      t:
        unit_scale: 273.15
        # ^ optional; Scaling factor
        unit_scale_method: "+"
        # ^ optional; Multiply = '*' , Add = '+', subtract = '-', divide = '/'
        nan_value: -1.0
        # ^ optional; When loading data, set this value to NaN
        ylabel_plot: "Temperature 2m (K)"
        # optional; set ylabel in order to include units and/or other info
        xlabel_plot: "Temperature 2m (K)"
        # optional; set ylabel in order to include units and/or other info
        vmin_plot: 260
        # ^ optional; Min for y-axis during plotting.
        #   To apply to a plot, change restrict_yaxis = True.
        vmax_plot: 300
        # ^ optional; Max for y-axis during plotting.
        #   To apply to a plot, change restrict_yaxis = True.
        vdiff_plot: 20.0
        # ^ optional; +/- range to use in bias plots.
        #   To apply to a plot, change restrict_yaxis = True.
        nlevels_plot: 21
        # ^ optional; number of levels used in colorbar for contourf plot.
      ws:
        unit_scale: 1
        unit_scale_method: "*"
        nan_value: -1.0
        ylabel_plot: "Windspeed 10m (m/s)"
        xlabel_plot: "Windspeed 10m (m/s)"
        vmin_plot: 0
        vmax_plot: 12
        vdiff_plot: 4
        nlevels_plot: 18
      wdir: 
        unit_scale: 1
        unit_scale_method: "*"
        nan_value: -1.0
        ylabel_plot: "Wind Direction 10m (deg)"
        xlabel_plot: "Wind Direction 10m (deg)"
        vmin_plot: 0
        vmax_plot: 370
        vdiff_plot: 4
        nlevels_plot: 18
      dpt:
        unit_scale: 273.15
        unit_scale_method: "+"
        nan_value: -1.0
        ylabel_plot: "Dewpoint 2m (K)"
        xlabel_plot: "Dewpoint 2m (K)"
        vmin_plot: 260
        vmax_plot: 290
        vdiff_plot: 4
        nlevels_plot: 18
    extra_calc:
      rose_plot:
        obs_wdir: "wdir"
        obs_wspd: "ws"

#-------------------------------------------------------------------
# Define which comparisons/plots to complete:
# Any key that is specific for a plot type will begin with ts for timeseries, ty for taylor
# Opt: Specifying the variable or variable group is optional
# For now all plots except time series average over the analysis window. 
# Setting axis values - If set_axis = True in data_proc section of each plot_grp the yaxis for the plot will be set based on the values specified in the obs section for each variable. If set_axis is set to False, then defaults will be used. 'vmin_plot' and 'vmax_plot' are needed for 'timeseries', 'spatial_overlay', and 'boxplot'. 'vdiff_plot' is needed for 'spatial_bias' plots and'ty_scale' is needed for 'taylor' plots. 'nlevels' or the number of levels used in the contour plot can also optionally be provided for spatial_overlay plot. If set_axis = True and the proper limits are not provided in the obs section, a warning will print, and the plot will be created using the default limits.
plots:
  plot_grp1:
    type: 'timeseries' # plot type
    fig_kwargs: #Opt to define figure options
      figsize: [12, 6] # figure size if multiple plots
    default_plot_kwargs: # Opt to define defaults for all plots. Model kwargs overwrite these.
      linewidth: 2.0
      markersize: 10.
    text_kwargs: #Opt
      fontsize: 18.
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['CONUS'] #List of domain names. If domain_type = all domain_name is used in plot title.
    
    data: ['ish_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      ts_select_time: 'time_local' #Time used for avg and plotting: Options: 'time' for UTC or 'time_local'
      ts_avg_window: 'h' # Options: None for no averaging or list pandas resample rule (e.g., 'h', 'D')
      set_axis: false #If select True, add vmin_plot and vmax_plot for each variable in obs.

  plot_grp2:
    type: 'spatial_bias' # plot type
    fig_kwargs: #For all spatial plots, specify map_kwargs here too.
      states: true
      figsize: [10, 5] # figure size 
    text_kwargs: #Opt
      fontsize: 16.    
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['CONUS'] #List of domain names. If domain_type = all domain_name is used in plot title.
    data: ['ish_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      wind_barb: True
      wind_barb_step: 10
      wind_barb_kwargs:
        length: 5
        linewidth: 1
        color: "black"
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      set_axis: false #If select True, add vdiff_plot for each variable in obs.
        
  plot_grp3:
    type: 'boxplot' # plot type
    fig_kwargs: #Opt to define figure options
      figsize: [8, 6] # figure size 
    text_kwargs: #Opt
      fontsize: 20.    
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['CONUS'] #List of domain names. If domain_type = all domain_name is used in plot title.
    data: ['ish_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      set_axis: false #If select True, add vmin_plot and vmax_plot for each variable in obs.
        
  plot_grp4:
    type: "rose_plot"
    text_kwargs:
      fontsize: 16.
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['CONUS'] #List of domain names. If domain_type = all domain_name is used in plot title.
    data: ['ish_cam-chem-se']
    color_map: "YlOrRd"  
    data_proc:
      rem_obs_nan: True
      set_axis: True
      wr_calm_limit: 0.5
  
  plot_grp5:
    type: "diurnal"
    fig_kwargs:
      figsize: [12, 6] 
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.
    text_kwargs: 
      fontsize: 24.
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['CONUS'] #List of domain names. If domain_type = all domain_name is used in plot title.
    data: ['ish_cam-chem-se']
    data_proc: 
      rem_obs_nan: True
      ts_select_time: "time_local" 
      ts_avg_window: "h"
      set_axis: false  

  plot_grp6:
    type: 'spatial_overlay' # plot type
    fig_kwargs: #For all spatial plots, specify map_kwargs here too.
      states: true
      figsize: [10, 5] # figure size 
    text_kwargs: #Opt
      fontsize: 16.
    domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
    domain_name: ['CONUS'] #List of domain names. If domain_type = all domain_name is used in plot title.
    data: ['ish_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
    data_proc:
      rem_obs_nan: true # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
      set_axis: false #If select True, add vmin_plot and vmax_plot for each variable in obs.

# #-----------------------------------------------------------------------------
stats:
  #Stats require positive numbers, so if you want to calculate temperature use Kelvin!
  #Wind direction has special calculations for AirNow if obs name is 'WD'
  stat_list: ['MB', 'ME', 'RMSE', 'NMB', 'NME', 'R2'] #List stat to calculate below. Dictionary of definitions included in plots/proc_stats.py
  #Full calc list ['STDO', 'STDP', 'MNB', 'MNE', 'MdnNB', 'MdnNE', 'NMdnGE','NO','NOP','NP','MO','MP', 'MdnO', 'MdnP', 'RM', 'RMdn', 'MB', 'MdnB', 'NMB', 'NMdnB', 'FB', 'ME', 'MdnE', 'NME', 'NMdnE', 'FE', 'MNPB', 'MdnNPB', 'MNPE', 'MdnNPE', 'NMPB', 'NMdnPB', 'NMPE', 'NMdnPE', 'R2', 'RMSE', 'd1', 'E1', 'IOA', 'AC', 'HSS', 'ETS'] 
  output_table: true #Always outputs a .txt file. Optional to also output as a table.
  domain_type: ['all'] #List of domain types: 'all' or any domain in obs file. (e.g., airnow: epa_region, state_name, siteid, etc.) 
  domain_name: ['CONUS'] #List of domain names. If domain_type = all domain_name is used in plot title.
  data: ['ish_cam-chem-se'] # make this a list of pairs in obs_model where the obs is the obs label and model is the model_label
